backend:
  name: git-gateway
  branch: main

# Permet de tester l'interface en local sans déployer : `npx decap-server` puis /admin/
local_backend: true

media_folder: "src/assets/actus"
public_folder: "/src/assets/actus"

locale: "fr"

collections:
  - name: "actus"
    label: "Actus"
    label_singular: "Article"
    description: "Les actualités de Blueberry : sorties, événements, vie de l'entreprise."
    folder: "src/content/actus"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    # Le volet d'aperçu ne sait pas afficher les images servies depuis /src/
    editor:
      preview: false
    fields:
      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Date"
        name: "date"
        widget: "datetime"
        # `format` pilote ce qui est écrit dans le fichier : YAML ne reconnaît
        # une date que sous forme ISO, sinon la validation du schéma la rejette.
        format: "YYYY-MM-DD"
        # Sans ça, Decap 3.2.1+ laisse le champ vide et bloque la publication.
        default: "{{now}}"
        # Sélecteur de date seule : l'heure n'a aucun intérêt pour un article.
        time_format: false
        picker_utc: false

      - label: "Catégorie"
        name: "category"
        widget: "select"
        default: "Vie de l’entreprise"
        options: ["Sorties", "Événements", "Vie de l’entreprise"]

      - label: "Résumé"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "Une ou deux phrases affichées dans la liste des actus."

      - label: "Photo de couverture"
        name: "cover"
        widget: "image"
        required: false
        allow_multiple: false
        media_library:
          config:
            max_file_size: 3000000

      - label: "Description de la photo de couverture"
        name: "coverAlt"
        widget: "string"
        required: false
        hint: "Décrit la photo pour les personnes malvoyantes. Ex. : « L'équipe sur le bateau »."

      - label: "Galerie photos"
        name: "gallery"
        widget: "list"
        required: false
        label_singular: "Photo"
        summary: "{{fields.caption}}"
        fields:
          - label: "Photo"
            name: "src"
            widget: "image"
            allow_multiple: false
            media_library:
              config:
                max_file_size: 3000000
          - label: "Légende"
            name: "caption"
            widget: "string"
            required: false

      - label: "Contenu"
        name: "body"
        widget: "markdown"
